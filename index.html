<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SamTech Flow</title>

  <style>
    /* ===== GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      background: #050816;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    .background {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent 40%),
                  radial-gradient(circle at 80% 30%, #9333ea, transparent 40%),
                  radial-gradient(circle at 50% 80%, #06b6d4, transparent 40%);
      animation: moveBg 12s infinite alternate;
      filter: blur(60px);
      z-index: -2;
    }

    @keyframes moveBg {
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(-5%, -5%) scale(1.1); }
    }

    /* ===== FLOATING PARTICLES ===== */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      animation: floatUp 10s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 0;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0.6;
      }
    }

    /* ===== MAIN CARD ===== */
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      opacity: 0.8;
      margin-bottom: 25px;
    }

    button {
      background: linear-gradient(90deg, #3b82f6, #9333ea);
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(147,51,234,0.6);
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background"></div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- MAIN UI -->
  <div class="card">
    <h1>SamTech Flow</h1>
    <p>Next-gen AI assistant powered by Cloud AI</p>

    <button onclick="launchApp()">Launch App</button>

    <div class="small">Powered by Google AI Studio + Cloud Run</div>
  </div>

  <script>
    // ===== APP REDIRECT =====
    function launchApp() {
      window.location.href = "https://ais-pre-i2albyunh5goiqgneu5zln-980552800811.europe-west2.run.app/https:/ais-pre-i2albyunh5goiqgneu5zln-980552800811.europe-west2.run.app/";
    }

    // ===== PARTICLE GENERATION =====
    const container = document.getElementById("particles");

    for (let i = 0; i < 40; i++) {
      const p = document.createElement("div");
      p.classList.add("particle");
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = (5 + Math.random() * 10) + "s";
      p.style.opacity = Math.random();
      container.appendChild(p);
    }
  </script>

</body>
</html>
